name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      
    # Only run Vercel deployment if all required secrets are available
    - name: Check for Vercel secrets
      id: check-secrets
      run: |
        if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_ORG_ID }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" ]]; then
          echo "has_vercel_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "has_vercel_secrets=false" >> $GITHUB_OUTPUT
          echo "::warning::Skipping Vercel deployment - required secrets not configured"
        fi

    - name: Deploy to Vercel (Production)
      if: |
        steps.check-secrets.outputs.has_vercel_secrets == 'true' && 
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        github-comment: false

    - name: Deploy to Vercel (Preview)
      if: |
        steps.check-secrets.outputs.has_vercel_secrets == 'true' && 
        github.ref != 'refs/heads/main' && 
        github.ref != 'refs/heads/master'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--no-wait'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        github-comment: true

    - name: Comment PR with build success
      if: |
        github.event_name == 'pull_request' && 
        steps.check-secrets.outputs.has_vercel_secrets == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Build Successful!**
            
            The application built successfully. Vercel deployment was skipped because the required secrets are not configured.
            
            To enable Vercel deployments, please configure the following repository secrets:
            - \`VERCEL_TOKEN\`
            - \`VERCEL_ORG_ID\`
            - \`VERCEL_PROJECT_ID\`
            `
          });
